name: afyadrop_mobile
description: Android-first AfyaDrop clinical decision support app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.6.0
  dio: ^5.7.0
  flutter_markdown: ^0.7.4+1
  shared_preferences: ^2.3.3
  image_picker: ^1.1.0
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.3.2
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/images/afyadrop_logo.png
